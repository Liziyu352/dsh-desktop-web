# Inserts the desktop-autoweb row into every profile that lists this bundle.
- insert:
    - id: desktop-autoweb
      name: '@liziyu352/dsh-desktop-web'
      config:
        # false keeps the browser untouched and only records the URL.
        openBrowser: true
        # 0 picks a free port; set a number to pin one.
        port: 0
        # Experimental: boot the Web build over the Desktop profile so it
        # carries every plugin and setting installed for Desktop.
        sharedProfile: false
